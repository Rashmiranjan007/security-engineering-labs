name: AI Agent Security Lab Tests

on:
  pull_request:
    paths:
      - "projects/ai-agent-security-lab/**"
      - ".github/workflows/ai-agent-security-lab.yml"
  push:
    paths:
      - "projects/ai-agent-security-lab/**"
      - ".github/workflows/ai-agent-security-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-agent-security-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run policy unit tests
        run: python -m unittest discover -s tests -v
