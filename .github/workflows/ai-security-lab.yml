name: AI Security Lab

on:
  push:
    paths:
      - "projects/ai-security/**"
      - ".github/workflows/ai-security-lab.yml"
  pull_request:
    paths:
      - "projects/ai-security/**"
      - ".github/workflows/ai-security-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression and API tests
        run: python -m unittest discover -s tests -v
      - name: Run demonstration
        run: python -m app.demo
      - name: Build container image
        run: docker build -t ai-security-lab:test .
