name: Kubernetes AI Workload Security

on:
  push:
    paths:
      - "projects/kubernetes-ai-workload-security/**"
      - ".github/workflows/kubernetes-ai-workload-security.yml"
  pull_request:
    paths:
      - "projects/kubernetes-ai-workload-security/**"
      - ".github/workflows/kubernetes-ai-workload-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s projects/kubernetes-ai-workload-security/tests -v
      - name: Run static guardrail checks
        run: python projects/kubernetes-ai-workload-security/tools/validate.py
