name: AI security assessment framework

on:
  push:
    paths:
      - "projects/ai-security-assessment-framework/**"
      - ".github/workflows/ai-security-assessment-framework.yml"
  pull_request:
    paths:
      - "projects/ai-security-assessment-framework/**"
      - ".github/workflows/ai-security-assessment-framework.yml"

permissions:
  contents: read

jobs:
  validate-assessment-catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic assessment catalogue
        working-directory: projects/ai-security-assessment-framework
        run: python tools/validate_catalogue.py --input test-cases/assessment-catalogue.json
      - name: Run validator unit tests
        working-directory: projects/ai-security-assessment-framework
        run: python -m unittest discover -s tools -v
