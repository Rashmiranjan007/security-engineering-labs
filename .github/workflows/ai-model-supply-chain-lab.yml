name: AI Model Supply Chain Lab

on:
  push:
    paths:
      - "projects/ai-model-supply-chain-lab/**"
      - ".github/workflows/ai-model-supply-chain-lab.yml"
  pull_request:
    paths:
      - "projects/ai-model-supply-chain-lab/**"
      - ".github/workflows/ai-model-supply-chain-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s projects/ai-model-supply-chain-lab/tests -v
      - name: Verify sample model artifact
        run: python projects/ai-model-supply-chain-lab/tools/verify_model.py
