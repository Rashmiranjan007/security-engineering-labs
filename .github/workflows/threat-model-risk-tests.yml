name: Threat model automated tests

on:
  push:
    paths:
      - "Threat-Modeling/enterprise-cloud-ai-platform/**"
      - ".github/workflows/threat-model-risk-tests.yml"
  pull_request:
    paths:
      - "Threat-Modeling/enterprise-cloud-ai-platform/**"
      - ".github/workflows/threat-model-risk-tests.yml"

permissions:
  contents: read

jobs:
  risk-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test risk scoring engine
        working-directory: Threat-Modeling/enterprise-cloud-ai-platform/tools
        run: python -m unittest -v
      - name: Test STRIDE threat identification engine
        working-directory: Threat-Modeling/enterprise-cloud-ai-platform/automation
        run: python -m unittest -v
      - name: Generate sample threat report
        working-directory: Threat-Modeling/enterprise-cloud-ai-platform/automation
        run: python stride_engine.py --input sample-architecture.json --output generated-threats.json
      - name: Test attack path analysis engine
        working-directory: Threat-Modeling/enterprise-cloud-ai-platform/automation
        run: python -m unittest test_attack_path_engine.py -v
      - name: Generate sample attack path report
        working-directory: Threat-Modeling/enterprise-cloud-ai-platform/automation
        run: python attack_path_engine.py --input sample-attack-graph.json --output attack-path-report.json
