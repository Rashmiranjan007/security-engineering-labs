name: Threat model risk-engine tests

on:
  push:
    paths:
      - "Threat-Modeling/enterprise-cloud-ai-platform/**"
      - ".github/workflows/threat-model-risk-tests.yml"
  pull_request:
    paths:
      - "Threat-Modeling/enterprise-cloud-ai-platform/**"
      - ".github/workflows/threat-model-risk-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run risk engine unit tests
        working-directory: Threat-Modeling/enterprise-cloud-ai-platform/tools
        run: python -m unittest -v
