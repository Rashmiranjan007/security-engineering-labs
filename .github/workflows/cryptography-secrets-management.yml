name: Cryptography and Secrets Management Lab

on:
  push:
    paths:
      - "projects/cryptography-secrets-management/**"
      - ".github/workflows/cryptography-secrets-management.yml"
  pull_request:
    paths:
      - "projects/cryptography-secrets-management/**"
      - ".github/workflows/cryptography-secrets-management.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/cryptography-secrets-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan synthetic fixtures
        run: |
          set +e
          python secret_scanner.py fixtures --json
          status=$?
          set -e
          test "$status" -eq 1
