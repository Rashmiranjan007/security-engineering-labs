name: Enterprise AI Governance GRC

on:
  push:
    paths:
      - "projects/enterprise-ai-governance-grc/**"
      - ".github/workflows/enterprise-ai-governance-grc.yml"
  pull_request:
    paths:
      - "projects/enterprise-ai-governance-grc/**"
      - ".github/workflows/enterprise-ai-governance-grc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate inventory and control catalogue
        run: |
          python -m json.tool projects/enterprise-ai-governance-grc/data/ai-inventory.json >/dev/null
          python -m json.tool projects/enterprise-ai-governance-grc/data/control-catalogue.json >/dev/null
          python -m json.tool projects/enterprise-ai-governance-grc/audit/evidence-register.json >/dev/null
      - name: Run governance engine unit tests
        run: python -m unittest discover -s projects/enterprise-ai-governance-grc/tests -v
      - name: Generate synthetic assessment report
        run: |
          cd projects/enterprise-ai-governance-grc
          python tools/governance_engine.py --inventory data/ai-inventory.json --controls data/control-catalogue.json --output-dir /tmp/ai-grc-reports
          test -s /tmp/ai-grc-reports/latest.json
          test -s /tmp/ai-grc-reports/latest.md
      - name: Validate dashboard and policy artefacts
        run: |
          test -s projects/enterprise-ai-governance-grc/dashboard/index.html
          test -s projects/enterprise-ai-governance-grc/governance/ai-governance-policy.md

      - name: Validate continuous-compliance source contracts
        run: |
          python -m json.tool projects/enterprise-ai-governance-grc/continuous-compliance/data/source-findings.json >/dev/null
          python -m json.tool projects/enterprise-ai-governance-grc/continuous-compliance/data/control-mappings.json >/dev/null
      - name: Run continuous-compliance unit tests
        run: python -m unittest discover -s projects/enterprise-ai-governance-grc/continuous-compliance/tests -v
      - name: Generate continuous-compliance report
        run: |
          cd projects/enterprise-ai-governance-grc/continuous-compliance
          python tools/compliance_pipeline.py --sources data/source-findings.json --rules data/control-mappings.json --controls ../data/control-catalogue.json --output-dir /tmp/continuous-compliance-report
          test -s /tmp/continuous-compliance-report/latest.json
          test -s /tmp/continuous-compliance-report/latest.md
      - name: Validate continuous-compliance dashboard
        run: test -s projects/enterprise-ai-governance-grc/continuous-compliance/dashboard/index.html
