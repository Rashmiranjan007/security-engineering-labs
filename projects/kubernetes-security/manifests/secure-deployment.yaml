apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-demo
  namespace: security-lab
  labels:
    app.kubernetes.io/name: hardened-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hardened-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hardened-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
