apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-inference-boundaries
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-inference
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform-gateway
      ports:
        - protocol: TCP
          port: 443
