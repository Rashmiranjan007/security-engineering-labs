apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-inference
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: model-inference
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: model-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-inference
        app.kubernetes.io/part-of: ai-platform
    spec:
      serviceAccountName: model-inference
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        workload-tier: gpu-inference
      tolerations:
        - key: workload-tier
          operator: Equal
          value: gpu-inference
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference
          # Replace with an approved immutable image digest before deployment.
          image: registry.example.com/ai/model-server@sha256:REPLACE_WITH_64_HEX_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: model-artifacts
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: approved-model-artifacts
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
