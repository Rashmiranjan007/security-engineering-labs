apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: ai-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-inference
    spec:
      serviceAccountName: ai-inference-sa
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inference
          # Replace with an approved registry image pinned by a real sha256 digest.
          image: 111122223333.dkr.ecr.us-east-1.amazonaws.com/ai-inference@sha256:REPLACE_WITH_64_HEX_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # Add nodeSelector/tolerations only with a dedicated, access-controlled GPU node group.
