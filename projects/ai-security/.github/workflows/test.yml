name: AI Security Lab Tests

on:
  push:
    paths:
      - "projects/ai-security/**"
  pull_request:
    paths:
      - "projects/ai-security/**"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run demo
        run: python -m app.demo
