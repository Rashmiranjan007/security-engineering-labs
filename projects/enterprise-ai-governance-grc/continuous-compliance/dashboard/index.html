<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuous Compliance</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:22px;background:#f4f6fa;color:#182235}main{max-width:1150px;margin:auto}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{background:#fff;border:1px solid #dce2ec;border-radius:12px;padding:15px;margin:12px 0}.metric{font-size:26px;font-weight:700}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e9f0}.state{font-weight:700}.attention_required{color:#b42318}.risk_accepted{color:#9a6700}.no_open_findings_in_snapshot{color:#16794b}button{padding:8px 12px;border:1px solid #aab4c5;background:white;border-radius:8px}#error{color:#b42318}
</style></head><body><main><h1>Continuous Compliance</h1><p class="muted">Synthetic security finding exports mapped to GRC controls and remediation actions.</p><button id="reload">Reload snapshot</button> <span id="status" class="muted"></span><p id="error"></p>
<div id="metrics" class="grid"></div>
<section class="card"><h2>Control attention</h2><div style="overflow-x:auto"><table><thead><tr><th>Control</th><th>Findings</th><th>Open</th><th>Accepted</th><th>Resolved</th><th>Snapshot state</th></tr></thead><tbody id="controls"></tbody></table></div></section>
<section class="card"><h2>Prioritized remediation backlog</h2><div style="overflow-x:auto"><table><thead><tr><th>Finding</th><th>Severity</th><th>Asset</th><th>Control</th><th>Suggested owner</th><th>Recommended action</th></tr></thead><tbody id="backlog"></tbody></table></div></section>
<p class="muted" id="note"></p></main>
<script>
async function load(){const status=document.querySelector('#status'),error=document.querySelector('#error');error.textContent='';status.textContent='Loading…';try{const response=await fetch('../reports/latest.json',{cache:'no-store'});if(!response.ok)throw new Error('Report missing. Run compliance_pipeline.py first.');const data=await response.json();const metrics=document.querySelector('#metrics');metrics.replaceChildren();const cards=[['Sources',data.source_count],['Findings',data.finding_count],['Critical',data.severity_summary.critical||0],['High',data.severity_summary.high||0],['Remediation items',data.remediation_backlog.length]];for(const [label,value] of cards){const box=document.createElement('div');box.className='card';const title=document.createElement('div');title.textContent=label;const number=document.createElement('div');number.className='metric';number.textContent=value;box.append(title,number);metrics.append(box)}const controls=document.querySelector('#controls');controls.replaceChildren();for(const item of data.control_summary){const tr=document.createElement('tr');for(const value of [item.control_id,item.snapshot_findings,item.open_or_in_progress,item.accepted_risk,item.resolved,item.assessment_state]){const td=document.createElement('td');td.textContent=value;if(value===item.assessment_state)td.className='state '+value;tr.append(td)}controls.append(tr)}const backlog=document.querySelector('#backlog');backlog.replaceChildren();for(const item of data.remediation_backlog){const tr=document.createElement('tr');for(const value of [item.finding_id,item.severity.toUpperCase(),item.asset,item.control_id,item.owner_role,item.recommendation]){const td=document.createElement('td');td.textContent=value;tr.append(td)}backlog.append(tr)}document.querySelector('#note').textContent=data.important_note;status.textContent='Snapshot '+data.snapshot_id+' · '+data.generated_on}catch(e){error.textContent=e.message;status.textContent=''}}document.querySelector('#reload').addEventListener('click',load);load();
</script></body></html>
